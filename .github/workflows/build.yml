name: Build Packet Shark APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract packet-shark.zip
        run: |
          mkdir -p temp_extracted
          unzip -o packet-shark.zip -d temp_extracted
          cp -rn temp_extracted/* .
          rm -rf temp_extracted

      # Generates gradlew dynamically if missing from the zip
      - name: Ensure Gradle Wrapper Exists
        run: |
          if [ ! -f gradlew ]; then
            echo "gradlew not found. Generating wrapper..."
            sudo apt-get update && sudo apt-get install -y gradle
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: packet-shark-apk
          path: app/build/outputs/apk/debug/*.apk
