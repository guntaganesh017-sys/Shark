name: Build Packet Shark APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract packet-shark.zip
        run: |
          if [ ! -f packet-shark.zip ]; then
            echo "Error: packet-shark.zip not found in root directory!"
            ls -la
            exit 1
          fi
          unzip -o packet-shark.zip -d temp_extracted
          if ls temp_extracted/*/gradlew 1> /dev/null 2>&1; then
            cp -rn temp_extracted/*/* .
          else
            cp -rn temp_extracted/* .
          fi
          rm -rf temp_extracted

      - name: Make Gradlew Executable
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            echo "Error: gradlew file not found after unzipping!"
            ls -la
            exit 1
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: packet-shark-apk
          path: app/build/outputs/apk/debug/*.apk
