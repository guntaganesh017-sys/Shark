name: Build Packet Shark APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract packet-shark.zip
        run: |
          if [ ! -f packet-shark.zip ]; then
            echo "::error::packet-shark.zip was not found in the root directory!"
            echo "Current files in repository:"
            ls -la
            exit 1
          fi
          
          mkdir -p temp_extracted
          unzip -o packet-shark.zip -d temp_extracted
          
          # Find where gradlew is located inside the zip
          GRADLEW_PATH=$(find temp_extracted -name gradlew | head -n 1)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::gradlew script was not found anywhere inside packet-shark.zip!"
            echo "Contents of extracted zip:"
            find temp_extracted -maxdepth 3
            exit 1
          fi
          
          PROJECT_ROOT=$(dirname "$GRADLEW_PATH")
          echo "Found project root at: $PROJECT_ROOT"
          
          # Copy project contents to current working directory
          cp -rn "$PROJECT_ROOT"/* .
          rm -rf temp_extracted

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: packet-shark-apk
          path: app/build/outputs/apk/debug/*.apk
